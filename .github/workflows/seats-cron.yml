name: Seats Cron

on:
  schedule:
    # Every 4 hours at :15 (GitHub Actions scheduling is best-effort; real delay can be 5-15 min under load).
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      term:
        description: "Term code (e.g. 1272 for Fall 2026). Defaults to the latest semester."
        required: false
        default: ""

concurrency:
  group: seats-cron
  cancel-in-progress: false

jobs:
  update-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
      CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Update seats
        run: node importers/updateSeats.js ${{ github.event.inputs.term }}
